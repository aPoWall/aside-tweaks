<!doctype html>
<html lang="en" data-look="aside">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="instrument.css">
<style>
  /* ширину задаём и документу: без неё браузер иногда не измеряет попап и выдаёт
     ему максимальный размер — окно разъезжается на 800×600 после действия */
  html { width: 320px; overflow-x: hidden; }
  body { width: 320px; }
  .inst-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; }
  .inst-head .inst-sub { margin-left: auto; }
  /* одна строка показаний: считаем только то, что не ноль */
  .readout { display: flex; align-items: baseline; gap: 6px; padding: 6px 9px; margin-bottom: 8px; }
  .readout .big { font-size: 12.5px; }
  .readout .sub { margin: 0; }
  .sec { padding-bottom: 7px; }
  .sec-label { margin-bottom: 3px; }
  .tile { padding: 6px 8px; }
  .tiles.three .tile { padding: 5px 7px; }
  :root[data-look="aside"] .tile-main { font-size: 11.5px; letter-spacing: -.01em; white-space: nowrap; }
  :root[data-look="aside"] .tile-main .k { font-size: 10.5px; }
  :root[data-look="aside"] .tiles.three .tile-main { font-size: 11px; }
  :root[data-look="aside"] .tile-sub { font-size: 10px; }
  :root[data-density="compact"] { --pad: 11px; }
  /* строка ответа держит высоту заранее: текст не должен переверстывать попап */
  .sign #status { flex: 1; min-height: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="inst-head">
    <div class="inst-title">aside tweaks</div>
    <div class="inst-sub">instrument 01 · <b id="ver">v4</b></div>
  </div>

  <div class="readout">
    <div class="big" id="stats">–</div>
    <div class="sub" id="statsub">counting</div>
  </div>

  <div id="secs"></div>

  <div class="sign">
    <span id="status"></span>
    <a href="https://github.com/aPoWall/aside-tweaks" target="_blank">github ↗</a>
    <a href="options.html" target="_blank">settings ↗</a>
  </div>

  <script src="theme.js"></script>
  <script src="commands.js"></script>
  <script src="popup.js"></script>
</body>
</html>
