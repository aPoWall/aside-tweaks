<!doctype html>
<html lang="en" data-look="aside">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/aim-mini-apps.css">
<link rel="stylesheet" href="vendor/aim-app-shell.css">
<link rel="stylesheet" href="instrument.css">
<style>
  /* ширину задаём и документу: без неё браузер иногда не измеряет попап и выдаёт
     ему максимальный размер – окно разъезжается на 800×600 после действия */
  html { width: 360px; overflow-x: hidden; }
  body { width: 360px; gap: 10px; }
  /* тело поверхности идёт от края до края, шапка и подвал держат отступ 16 */
  .aim-shell-body { margin: 0 calc(var(--aim-shell-inset) * -1); }
  .sec { padding: 0 var(--aim-shell-inset) 9px; }
  .sec-label { margin-bottom: 3px; }
  .tile { padding: 6px 8px; }
  .tiles.three .tile { padding: 5px 7px; }
  :root[data-look="aside"] .tile-main { font-size: 11.5px; letter-spacing: -.01em; white-space: nowrap; }
  :root[data-look="aside"] .tile-main .k { font-size: 10.5px; }
  :root[data-look="aside"] .tiles.three .tile-main { font-size: 11px; }
  :root[data-look="aside"] .tile-sub { font-size: 10px; }
  /* строка ответа держит высоту заранее: текст не должен переверстывать попап */
  .aim-shell-foot #status { min-height: 12px; }
</style>
</head>
<body class="aim-shell" data-appear>
  <header class="aim-shell-head">
    <span class="aim-shell-mark" data-aim-mark="aside"></span>
    <span class="aim-shell-title"><b>aside tweaks</b><small id="statsub">counting</small></span>
    <span class="aim-shell-gap"></span>
    <span class="aim-shell-version" data-aim-version></span>
    <button class="aim-shell-btn" id="settings" title="settings of the extension">settings</button>
  </header>

  <div class="aim-shell-body" id="secs"></div>

  <footer class="aim-shell-foot">
    <span id="status">⇧⌘K palette · ⌥⌘D review</span>
    <span>esc close</span>
    <span id="stats">counting</span>
  </footer>

  <script src="theme.js"></script>
  <script src="vendor/aim-app-mark.js"></script>
  <script src="shell.js"></script>
  <script src="commands.js"></script>
  <script src="popup.js"></script>
</body>
</html>
