<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>palette</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --accent: #111; --accent-fg: #fff;
    --bg: #fff; --bg-soft: #f6f6f6; --line: #e6e6e6;
    --fg: #111; --muted: #8e8e8e; --dim: #6f6f6f; --sel: #eee;
  }
  html, body { height: 100%; }
  /* мягкое появление окна и строк — палитра должна «вплывать», а не мигать */
  @keyframes winin { from { opacity: 0; transform: scale(.985) translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes rowin { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  body { animation: winin .14s cubic-bezier(.2,.7,.3,1) both; }
  .item { animation: rowin .13s ease both; }
  .item.sel { transition: background .1s, box-shadow .1s; }
  #scopes button { transition: background .12s, color .12s; }
  body {
    font: 12.5px/1.45 "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* области поиска — переключаются Tab, как в нативном окне Aside */
  #scopes {
    display: flex; align-items: center; gap: 2px;
    padding: 8px 14px 0; font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  }
  #scopes button {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    border: none; background: none; color: var(--muted);
    padding: 3px 7px; border-radius: 3px; cursor: pointer;
  }
  #scopes button.on { color: var(--accent-fg); background: var(--accent); }
  #scopes .tabhint { margin-left: auto; color: var(--muted); letter-spacing: .1em; }

  #q {
    width: 100%; padding: 12px 14px 13px; font: inherit; font-size: 15px;
    border: none; border-bottom: 1px solid var(--line); outline: none;
    background: var(--bg); color: var(--fg);
  }
  #q::placeholder { color: var(--muted); }

  #list { flex: 1; overflow-y: auto; padding: 4px 0 6px; transition: opacity .12s ease; }
  #list.fading { opacity: .25; }
  /* слоем на странице: скруглённые углы принадлежат рамке, а не документу */
  html.embed, html.embed body { border-radius: 13px; overflow: hidden; }
  .item {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 14px; cursor: pointer; white-space: nowrap;
  }
  .item.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .item img { width: 15px; height: 15px; flex: none; border-radius: 2px; }
  .item .glyph { width: 15px; text-align: center; flex: none; color: var(--dim); font-size: 11px; }
  .item .t { overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
  .item .s { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .item .badge {
    flex: none; font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
  }
  .hdr {
    padding: 9px 14px 3px; font-size: 8.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
  }
  .calc {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    font-size: 17px; display: flex; align-items: baseline; gap: 10px;
  }
  .calc .eq { color: var(--muted); font-size: 11px; }
  #hint {
    padding: 7px 14px; border-top: 1px solid var(--line);
    font-size: 9.5px; color: var(--muted); display: flex; gap: 13px;
  }
  #hint b { font-weight: 400; color: var(--dim); }
</style>
</head>
<body>
  <div id="scopes">
    <button data-scope="all">all</button><button data-scope="tabs">tabs</button><button data-scope="history">history</button><button data-scope="bookmarks">bookmarks</button><button data-scope="commands">commands</button>
    <span class="tabhint">tab ⇥ to switch</span>
  </div>
  <input id="q" placeholder="search tabs, history, bookmarks · paste a url · type 2+2" autocomplete="off" spellcheck="false">
  <div id="list"></div>
  <div id="hint">
    <span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>⇧↵</b> open pinned</span><span><b>⇥</b> scope</span><span><b>esc</b> close</span>
    <span style="margin-left:auto;opacity:.7">aside tweaks · apowall</span>
  </div>
  <script src="theme.js"></script>
  <script src="commands.js"></script>
  <script src="palette.js"></script>
</body>
</html>
