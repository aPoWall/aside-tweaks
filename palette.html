<!doctype html>
<html lang="en" data-look="aside">
<head>
<meta charset="utf-8">
<title>aside tweaks</title>
<link rel="stylesheet" href="instrument.css">
<style>
  /* токены приходят из instrument.css — палитра, попап, панель и настройки красятся одним файлом */
  html, body { height: 100%; }
  /* body позиционирован: панель действий ⌘K привязана к палитре, а не к окну вкладки */
  body { position: relative; font: var(--font-size)/1.4 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  /* слоем на странице: скруглённые углы принадлежат рамке, а не документу */
  html.embed, html.embed body { border-radius: 12px; overflow: hidden; }

  /* строка ввода — крупно и без рамки, как в Raycast */
  #top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  #top svg { flex: none; color: var(--muted); }
  #q {
    flex: 1; min-width: 0; padding: 0;
    font: 17px/1.3 var(--font); border: none; outline: none;
    background: transparent; color: var(--fg);
  }
  #q::placeholder { color: var(--muted); }

  /* области поиска — чипы под полем, переключаются ⇥; выбранный чип — та же белая пилюля */
  #scopes {
    display: flex; align-items: center; gap: 2px;
    padding: 0 12px 8px; border-bottom: 1px solid var(--line);
  }
  #scopes button {
    font: 11px/1 var(--font); border: none; background: none; color: var(--muted);
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  #scopes button:hover { color: var(--fg); }
  #scopes button.on { color: var(--fg); background: var(--sel); box-shadow: var(--sel-shadow); }
  #scopes .desk { margin-left: auto; font-size: 10.5px; color: var(--muted); padding-right: 4px; }
  #scopes .desk::before { content: '●'; font-size: 7px; vertical-align: 2px; margin-right: 5px; color: var(--sleep); }
  #scopes .desk.off { display: none; }

  #list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; transition: opacity .09s ease; }
  #list.swap { opacity: 0; }
  .hdr { padding: 10px 8px 4px; font-size: 11px; color: var(--muted); }
  :root[data-look="aside"] .hdr::first-letter { text-transform: uppercase; }

  /* строка: иконка · заголовок · подпись · [×N] · тип справа — как в Raycast, где справа стоит «Application» */
  .item {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px; border-radius: var(--radius);
    cursor: pointer; white-space: nowrap;
  }
  .item.sel { background: var(--sel); box-shadow: var(--sel-shadow); }
  .item img { width: 18px; height: 18px; flex: none; border-radius: 4px; }
  .item .glyph { width: 18px; text-align: center; flex: none; color: var(--dim); font-size: 13px; }
  .item .t { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; font-size: 13px; }
  /* совпадение с запросом — полужирно, без заливки, как выделяет Alfred */
  .item mark { background: none; color: var(--fg); font-weight: 600; }
  .item .s mark { color: var(--dim); font-weight: 500; }
  /* тёмный облик: выбранная строка светлее поля и с тонкой обводкой, иначе она сливается */
  :root[data-theme="dark"] .item.sel { background: #3a3a3f; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  :root[data-theme="dark"] #scopes button.on { background: #3a3a3f; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  :root[data-theme="dark"] #acts .a.sel { background: #3a3a3f; }
  .item .why { flex: none; font-size: 10.5px; color: var(--sleep); }
  .item .s { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .item .twin, .item .tag { flex: none; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 15px; }
  .item .tag { text-transform: lowercase; }
  .item .date { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .k { flex: none; font-size: 11px; color: var(--muted); }
  .item .kind { flex: none; font-size: 11px; color: var(--muted); min-width: 52px; text-align: right; }
  .item.sel .kind { color: var(--dim); }

  .calc {
    padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
    font-size: 20px; display: flex; align-items: baseline; gap: 10px;
  }
  .calc .eq { color: var(--muted); font-size: 11px; }

  /* нижняя строка как в Raycast: слева имя инструмента, справа главное действие и «actions ⌘K» */
  #hint {
    padding: 7px 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 14px;
  }
  #hint b { font-weight: 500; color: var(--dim); }
  #hint .brand { display: flex; align-items: center; gap: 7px; }
  #hint .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--fg); display: inline-block; }
  #hint .right { margin-left: auto; display: flex; gap: 14px; }
  #hint .primary { color: var(--fg); }
  #hint button { font: inherit; border: none; background: none; color: inherit; padding: 0; cursor: pointer; }
  #hint button:hover { color: var(--fg); }

  /* панель действий ⌘K — всплывает над нижней строкой справа, как у Raycast */
  #acts {
    position: absolute; right: 12px; bottom: 40px; min-width: 250px;
    background: var(--tile); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
    padding: 6px; display: none; flex-direction: column;
  }
  #acts.on { display: flex; }
  #acts .ah { font-size: 10.5px; color: var(--muted); padding: 4px 8px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  #acts .a { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  #acts .a.sel { background: var(--sel); box-shadow: var(--sel-shadow); }
  :root[data-theme="dark"] #acts .a.sel { background: var(--bg); }
  #acts .a .k { margin-left: auto; font-size: 11px; color: var(--muted); }

  /* первая отрисовка мягко проявляется; дальнейшие перерисовки — без анимации,
     иначе список мигает на каждой букве и каждом движении мыши */
  @keyframes rowin { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  #list.first .item, #list.first .hdr { animation: rowin .14s ease both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* бумажный облик: моноширинный нижний регистр, заголовки разрядкой, акцентная полоса слева */
  :root[data-look="paper"] .hdr, :root[data-look="paper"] #scopes button,
  :root[data-look="paper"] .item .twin, :root[data-look="paper"] .item .kind {
    letter-spacing: .12em; text-transform: uppercase; font-size: 9px;
  }
  :root[data-look="paper"] .item { border-radius: 3px; height: 30px; }
  :root[data-look="paper"] .item .t { font-size: 12px; }
  :root[data-look="paper"] .item.sel { box-shadow: inset 2px 0 0 var(--accent); }
  :root[data-look="paper"] #scopes button.on { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  :root[data-look="paper"] #q { font-size: 15px; }
</style>
</head>
<body>
  <div id="top">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.6"/><path d="M10.4 10.4L14 14" stroke-linecap="round"/></svg>
    <input id="q" placeholder="search tabs, history, bookmarks, notes · paste a url · > agent · 2+2" autocomplete="off" spellcheck="false">
  </div>
  <div id="scopes">
    <button data-scope="all">all</button><button data-scope="tabs">tabs</button><button data-scope="history">history</button><button data-scope="bookmarks">bookmarks</button><button data-scope="notes">notes</button><button data-scope="commands">commands</button>
    <span class="desk off" id="deskdot" title="desk bridge: notes and agents come from the machine">desk</span>
  </div>
  <div id="list" class="first"></div>
  <div id="acts" role="menu"></div>
  <div id="hint">
    <span class="brand"><i></i>aside tweaks</span>
    <span class="right">
      <span><b class="primary" id="primary">open</b> <b>↵</b></span>
      <button id="actsbtn"><b>actions</b> ⌘K</button>
    </span>
  </div>
  <script src="theme.js"></script>
  <script src="commands.js"></script>
  <script src="palette.js"></script>
</body>
</html>
