<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>palette</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  /* значения по умолчанию = облик aside, чтобы до ответа storage не мигала бумага */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    --font-size: 12.5px; --radius: 8px;
    --accent: #111; --accent-fg: #fff;
    --bg: #ececec; --bg-soft: #f6f6f6; --line: #dddddd;
    --fg: #1c1c1e; --muted: #6f6f6f; --dim: #48484a; --sel: #fff; --sleep: #8f7fc9;
    --sel-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 1px rgba(0,0,0,.03);
  }
  html, body { height: 100%; }
  body {
    font: var(--font-size)/1.4 var(--font);
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* слоем на странице: скруглённые углы принадлежат рамке, а не документу */
  html.embed, html.embed body { border-radius: 12px; overflow: hidden; }

  /* строка ввода — крупно и без рамки, как командная строка Arc */
  #top { display: flex; align-items: center; gap: 10px; padding: 13px 16px 10px; }
  #top svg { flex: none; color: var(--muted); }
  #q {
    flex: 1; min-width: 0; padding: 0;
    font: 16px/1.3 var(--font); border: none; outline: none;
    background: transparent; color: var(--fg);
  }
  #q::placeholder { color: var(--muted); }

  /* области поиска — чипы под полем, переключаются ⇥; выбранный чип — та же белая пилюля, что и строка */
  #scopes {
    display: flex; align-items: center; gap: 2px;
    padding: 0 12px 8px; border-bottom: 1px solid var(--line);
  }
  #scopes button {
    font: 11px/1 var(--font); border: none; background: none; color: var(--muted);
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
  }
  #scopes button:hover { color: var(--fg); }
  #scopes button.on { color: var(--fg); background: var(--sel); box-shadow: var(--sel-shadow); }

  #list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; transition: opacity .09s ease; }
  #list.swap { opacity: 0; }
  .hdr { padding: 10px 8px 4px; font-size: 11px; color: var(--muted); }
  :root[data-look="aside"] .hdr::first-letter { text-transform: uppercase; }

  .item {
    display: flex; align-items: center; gap: 9px;
    height: 30px; padding: 0 8px; border-radius: var(--radius);
    cursor: pointer; white-space: nowrap;
  }
  .item.sel { background: var(--sel); box-shadow: var(--sel-shadow); }
  .item img { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .item .glyph { width: 16px; text-align: center; flex: none; color: var(--dim); font-size: 12px; }
  .item .t { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .item .s { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
  .item .twin { flex: none; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 15px; }
  .item .k { flex: none; font-size: 11px; color: var(--muted); }
  /* подсказка действия видна только на выбранной строке — как в командной строке Arc */
  .item .hint { flex: none; font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .1s; }
  .item.sel .hint { opacity: 1; }

  .calc {
    padding: 10px 16px 12px; border-bottom: 1px solid var(--line);
    font-size: 20px; display: flex; align-items: baseline; gap: 10px;
  }
  .calc .eq { color: var(--muted); font-size: 11px; }

  #hint {
    padding: 7px 16px; border-top: 1px solid var(--line);
    font-size: 10.5px; color: var(--muted); display: flex; gap: 14px;
  }
  #hint b { font-weight: 500; color: var(--dim); }

  /* первая отрисовка мягко проявляется; дальнейшие перерисовки — без анимации,
     иначе список мигает на каждой букве и каждом движении мыши */
  @keyframes rowin { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  #list.first .item, #list.first .hdr { animation: rowin .14s ease both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* бумажный облик: моноширинный нижний регистр, заголовки разрядкой, акцентная полоса слева */
  :root[data-look="paper"] .hdr, :root[data-look="paper"] #scopes button,
  :root[data-look="paper"] .item .twin, :root[data-look="paper"] .item .hint {
    letter-spacing: .12em; text-transform: uppercase; font-size: 9px;
  }
  :root[data-look="paper"] .item { border-radius: 3px; height: 28px; }
  :root[data-look="paper"] .item.sel { box-shadow: inset 2px 0 0 var(--accent); }
  :root[data-look="paper"] #scopes button.on { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  :root[data-look="paper"] #q { font-size: 15px; }
</style>
</head>
<body>
  <div id="top">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.6"/><path d="M10.4 10.4L14 14" stroke-linecap="round"/></svg>
    <input id="q" placeholder="search tabs, history, bookmarks · paste a url · type 2+2" autocomplete="off" spellcheck="false">
  </div>
  <div id="scopes">
    <button data-scope="all">all</button><button data-scope="tabs">tabs</button><button data-scope="history">history</button><button data-scope="bookmarks">bookmarks</button><button data-scope="commands">commands</button>
  </div>
  <div id="list" class="first"></div>
  <div id="hint">
    <span><b>↑↓</b> move</span><span><b>↵</b> open</span><span><b>⇧↵</b> pin</span><span><b>⇥</b> scope</span><span><b>esc</b> close</span>
    <span style="margin-left:auto;opacity:.7">aside tweaks · apowall</span>
  </div>
  <script src="theme.js"></script>
  <script src="commands.js"></script>
  <script src="palette.js"></script>
</body>
</html>
