<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aside tweaks · panel</title>
<link rel="stylesheet" href="instrument.css">
<style>
  :root { --pad: 11px; --row: 24px; }
  :root[data-density="compact"] { --pad: 10px; --row: 23px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; font-size: 11px; }

  header {
    display: flex; align-items: baseline; gap: 9px;
    padding: 10px var(--pad) 8px; border-bottom: 1px solid var(--line);
  }
  header .name { font-size: 13px; letter-spacing: -.01em; }
  header .count { margin-left: auto; font-size: 9.5px; color: var(--muted); }
  header .gear { border: none; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  header .gear:hover { color: var(--fg); }

  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 6px; }

  .sec-hdr {
    display: flex; align-items: center; gap: 7px;
    padding: 12px var(--pad) 5px;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .sec-hdr .n { color: var(--accent); }
  .sec-hdr::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .blk { padding: 8px var(--pad) 2px; font-size: 9px; letter-spacing: .05em; color: var(--dim); }

  .row {
    display: flex; align-items: center; gap: 8px;
    min-height: var(--row); padding: 2px var(--pad); cursor: default; white-space: nowrap;
    animation: rowin .16s ease both;
  }
  @keyframes rowin { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
  .row:hover { background: var(--sel); }
  .row.active { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .row.drop-into { box-shadow: inset 0 -2px 0 var(--accent); }
  /* только что улетевшее наверх подсвечивается, как делал Arc */
  @keyframes flashrow {
    0%   { background: var(--accent); color: var(--accent-fg); }
    70%  { background: var(--accent); color: var(--accent-fg); }
    100% { background: transparent; }
  }
  .row.flash { animation: flashrow 1.6s ease both; }
  .row.flash .t { color: inherit; }
  .row img { width: 14px; height: 14px; flex: none; border-radius: 2px; }
  .row .glyph { width: 14px; text-align: center; flex: none; color: var(--dim); font-size: 10px; }
  .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row.sleeping .t { color: var(--muted); }
  .row .act {
    opacity: 0; flex: none; border: none; background: none;
    color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 0 3px;
    transition: opacity .12s;
  }
  .row:hover .act { opacity: 1; }
  .row .act:hover { color: var(--fg); }
  .row .act.on { opacity: 1; color: var(--accent); }

  .cmds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 4px var(--pad) 12px; }
  .cmds .tile { padding: 8px 10px; }
  .cmds .tile-main { font-size: 11px; }

  footer {
    display: flex; align-items: center; gap: 9px;
    padding: 7px var(--pad); border-top: 1px solid var(--line);
    font-size: 9px; color: var(--muted);
  }
  footer #status { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); }
  .empty { padding: 3px var(--pad) 7px; font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <span class="name">tweaks</span>
    <span class="count" id="count">–</span>
    <button class="gear" id="gear" title="settings">⚙</button>
  </header>

  <main>
    <div class="sec-hdr"><span class="n">01</span> ★ bookmarks · last rows of the bar <span id="nFav">0</span></div>
    <div id="favs"></div>

    <div class="sec-hdr"><span class="n">02</span> ◆ pinned · squares on top <span id="nPins">0</span></div>
    <div id="pins"></div>

    <div class="sec-hdr"><span class="n">03</span> ▤ tabs · grouped by blocks <span id="nTabs">0</span></div>
    <div id="tabs"></div>

    <div class="sec-hdr"><span class="n">04</span> ⚡ commands · act on this window</div>
    <div class="cmds">
      <button class="tile" data-action="tidyUp" title="clean duplicates and empty tabs, flatten groups, order, rebuild blocks">
        <span class="tile-main">✦ tidy up <span class="k">⌥⌘T</span></span><span class="tile-sub">one sweep</span></button>
      <button class="tile" data-action="tidyDuplicates" title="close duplicates and empty tabs only, leave the order alone">
        <span class="tile-main">⊗ duplicates</span><span class="tile-sub">clean only</span></button>
      <button class="tile" data-action="groupByRules" title="group tabs by the blocks from settings">
        <span class="tile-main">▤ by blocks</span><span class="tile-sub">your rules</span></button>
      <button class="tile" data-action="groupByDomain" title="group tabs by root domain">
        <span class="tile-main">◈ by site</span><span class="tile-sub">root domain</span></button>
      <button class="tile" data-action="ungroupAll" title="flatten every group in this window">
        <span class="tile-main">⊟ ungroup</span><span class="tile-sub">flatten</span></button>
      <button class="tile" data-action="sortByDomain" title="order tabs alphabetically by host">
        <span class="tile-main">↕ order by site</span><span class="tile-sub">a → z</span></button>
      <button class="tile" data-action="sortByOpened" title="order tabs by the moment they were opened">
        <span class="tile-main">↻ by opened</span><span class="tile-sub">oldest first</span></button>
    </div>
  </main>

  <footer>
    <span id="status">★ to the bar · ◆ pin · × close · ⇧⌘K search</span>
    <a href="https://github.com/aPoWall/aside-tweaks" target="_blank">apowall ↗</a>
  </footer>

  <script src="theme.js"></script>
  <script src="panel.js"></script>
</body>
</html>
