<!doctype html>
<html lang="en" data-look="aside">
<head>
<meta charset="utf-8">
<title>aside tweaks · panel</title>
<link rel="stylesheet" href="vendor/aim-mini-apps.css">
<link rel="stylesheet" href="vendor/aim-app-shell.css">
<link rel="stylesheet" href="instrument.css">
<style>
  :root { --pad: 12px; --row: 36px; }
  :root[data-density="compact"] { --pad: 10px; --row: 29px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; font-size: 12.5px; }

  /* шапка и подвал – общая оболочка (vendor/aim-app-shell.css); панель добавляет только линии */
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }

  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 6px; }

  .sec-hdr {
    display: flex; align-items: center; gap: 7px;
    padding: 12px var(--pad) 5px;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .sec-hdr .n { color: var(--accent); }
  .sec-hdr::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .blk { padding: 8px var(--pad) 2px; font-size: 9px; letter-spacing: .05em; color: var(--dim); }

  .row {
    display: flex; align-items: center; gap: 8px;
    min-height: var(--row); padding: 2px var(--pad); cursor: default; white-space: nowrap;
  }
  .row:hover { background: var(--sel); }
  .row.active { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .row.drop-into { box-shadow: inset 0 -2px 0 var(--accent); }
  /* только что добавленная строка подсвечивается, не меняя порядок остальных */
  @keyframes flashrow {
    0%   { background: var(--accent); color: var(--accent-fg); }
    70%  { background: var(--accent); color: var(--accent-fg); }
    100% { background: transparent; }
  }
  .row.flash { animation: flashrow 1.6s ease both; }
  .row.flash .t { color: inherit; }
  .row img { width: 18px; height: 18px; flex: none; border-radius: 3px; }
  .row .glyph { width: 14px; text-align: center; flex: none; color: var(--dim); font-size: 10px; }
  .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row.sleeping .t { color: var(--muted); }
  .row .tag { flex: none; font-size: 9.5px; color: var(--muted); opacity: .75; max-width: 42%; overflow: hidden; text-overflow: ellipsis; }
  .row:hover .tag { opacity: 0; }
  .row .tag.now { color: var(--accent); opacity: 1; letter-spacing: .04em; }
  .row .act {
    opacity: 0; flex: none; border: none; background: none;
    color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 0 3px;
    transition: opacity .12s;
  }
  .row:hover .act, .row:focus-within .act { opacity: 1; }
  .row:focus-within .tag { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .act:hover { color: var(--fg); }
  .row .act.on { opacity: 1; color: var(--accent); }

  .cmds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 4px var(--pad) 12px; }
  .cmds .tile { padding: 8px 10px; }
  .cmds .tile-main { font-size: 11px; }

  .review-bar {
    display: flex; align-items: center; gap: 8px;
    min-height: 34px; padding: 5px var(--pad);
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .review-bar .aim-shell-btn { min-height: 24px; font-size: 10px; font-weight: 650; }
  .review-bar span { color: var(--muted); font-size: 9.5px; }
  .runtime-notice { color: var(--accent); }

  .command-drawer { margin-top: 7px; border-top: 1px solid var(--line); }
  .command-drawer summary {
    display: flex; align-items: center; gap: 7px; cursor: pointer; list-style: none;
    padding: 10px var(--pad); color: var(--muted); font-size: 10px;
  }
  .command-drawer summary::-webkit-details-marker { display: none; }
  .command-drawer summary::before { content: '›'; width: 9px; color: var(--dim); transition: transform .14s ease; }
  .command-drawer[open] summary::before { transform: rotate(90deg); }
  .command-drawer summary .key { margin-left: auto; font-size: 9px; color: var(--dim); }

  .empty { padding: 3px var(--pad) 7px; font-size: 10px; color: var(--muted); }

  /* облик aside: строки-пилюли со скруглением, подписи секций как в сайдбаре, спящие с zz */
  :root[data-look="aside"] .row { margin: 0 6px; padding: 2px calc(var(--pad) - 6px); border-radius: var(--radius); }
  :root[data-look="aside"] .row.active { box-shadow: var(--sel-shadow); }
  :root[data-look="aside"] .row.drop-into { box-shadow: inset 0 -2px 0 var(--fg); }
  :root[data-look="aside"] .sec-hdr { text-transform: none; letter-spacing: 0; font-size: 11px; }
  :root[data-look="aside"] .sec-hdr .n { color: var(--muted); }
  :root[data-look="aside"] .blk { font-size: 10.5px; letter-spacing: 0; }
  :root[data-look="aside"] .empty { font-size: 10.5px; }
  .nav-tools { display: flex; gap: 6px; padding: 8px var(--pad); border-bottom: 1px solid var(--line); }
  .nav-tools input { min-width: 0; flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sel); color: var(--fg); font: inherit; }
  .nav-tools select { max-width: 100px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; }
  #pins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 10px var(--pad) 4px; }
  #pins .empty { grid-column: 1 / -1; }
  .pin-square { height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--line); color: var(--fg); cursor: pointer; }
  .pin-square img { width: 21px; height: 21px; border-radius: 4px; }
  .pin-square.active { background: var(--sel); box-shadow: inset 0 0 0 2px var(--accent); }
  .nav-group { margin: 4px 6px; }
  .nav-group summary { padding: 8px 6px; color: var(--muted); cursor: pointer; font-size: 11px; }
  .nav-group .row { margin-left: 10px; }
  .history-drawer { margin-top: 12px; border-top: 1px solid var(--line); }
  .history-drawer > summary { padding: 12px var(--pad); color: var(--muted); cursor: pointer; }
  .history-drawer > summary span { float: right; }
  .review-bar #review-note { flex: 1; }
  .review-bar { flex-wrap: wrap; }
  .sec-hdr { margin-top: 8px; }
  .row .tag:not(.now) { display: none; }
  .row .act { width: 22px; min-height: 24px; padding: 0; }
</style>
</head>
<body data-aim-surface="panel">
  <header class="aim-shell-head">
    <span class="aim-shell-mark" data-aim-mark="aside" data-aim-voxel="aside" title="aside character · click for its gesture"></span>
    <span class="aim-shell-title"><b>aside tweaks</b><small id="count">counting</small></span>
    <span class="aim-shell-gap"></span>
    <span class="aim-shell-version" data-aim-version></span>
    <button class="aim-shell-btn" id="settings" title="settings of the extension">settings</button>
    <button class="aim-shell-btn aim-shell-icon" id="close-panel" title="close the panel · esc">×</button>
  </header>

  <div class="review-bar">
    <button class="aim-shell-btn" id="remove-duplicates" title="show exact duplicates and empty tabs before anything closes">− remove duplicates</button>
    <span id="review-note">preview first</span>
    <button class="aim-shell-btn" id="show-active" title="clear the filter and reveal the current page" aria-label="reveal current page">◎ current</button>
    <span class="runtime-notice" id="runtime-notice" role="status" hidden>update waiting · reload Aside Tweaks once</span>
  </div>

  <div class="nav-tools">
    <input type="search" id="panel-search" placeholder="filter this window · ⌘F" aria-label="filter tabs and bookmarks" autocomplete="off">
    <select id="panel-grouping" aria-label="tab display grouping" title="display only · browser groups stay unchanged"><option value="native">groups</option><option value="sites">sites</option><option value="flat">list</option></select>
  </div>
  <main class="aim-shell-body">
    <div class="sec-hdr" title="native pinned tabs; ⇧⌘D toggles the square">Pins <span id="nPins">0</span></div>
    <div id="pins"></div>

    <div class="sec-hdr" title="native Aside Bookmarks rows; ⌘D appends the active page at the bottom">Bookmarks <span id="nFav">0</span></div>
    <div id="favs"></div>

    <div class="sec-hdr">Tabs <span id="nTabs">0</span></div>
    <div id="tabs"></div>

    <details id="history-drawer" class="history-drawer"><summary>Recent history <span id="nHistory">0</span></summary><div id="history"></div></details>

    <details class="command-drawer">
      <summary><span>⚡</span><span>commands for this window</span><span class="key">⇧⌘K</span></summary>
      <div class="cmds" id="cmds"></div>
    </details>
  </main>

  <footer class="aim-shell-foot">
    <span id="status"><b data-aim-key="toggle-surface">⌥⇧A</b> panel · ★ bar · ◆ pin</span>
    <span>esc close</span>
    <span data-aim-version></span>
  </footer>

  <script src="theme.js"></script>
  <script src="vendor/aim-app-mark.js"></script>
  <script src="vendor/aim-voxel.js"></script>
  <script src="shell.js"></script>
  <script src="commands.js"></script>
  <script src="navigation.js"></script>
  <script src="panel.js"></script>
</body>
</html>
