<!doctype html>
<html lang="en" data-look="aside">
<head>
<meta charset="utf-8">
<title>aside tweaks · panel</title>
<link rel="stylesheet" href="vendor/aim-mini-apps.css">
<link rel="stylesheet" href="vendor/aim-app-shell.css">
<link rel="stylesheet" href="instrument.css">
<style>
  :root { --pad: 11px; --row: 24px; }
  :root[data-density="compact"] { --pad: 10px; --row: 23px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; font-size: 11px; }

  /* шапка и подвал – общая оболочка (vendor/aim-app-shell.css); панель добавляет только линии */
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }

  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 6px; }

  .sec-hdr {
    display: flex; align-items: center; gap: 7px;
    padding: 12px var(--pad) 5px;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .sec-hdr .n { color: var(--accent); }
  .sec-hdr::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .blk { padding: 8px var(--pad) 2px; font-size: 9px; letter-spacing: .05em; color: var(--dim); }

  .row {
    display: flex; align-items: center; gap: 8px;
    min-height: var(--row); padding: 2px var(--pad); cursor: default; white-space: nowrap;
  }
  .row:hover { background: var(--sel); }
  .row.active { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
  .row.drop-into { box-shadow: inset 0 -2px 0 var(--accent); }
  /* только что улетевшее наверх подсвечивается, как делал Arc */
  @keyframes flashrow {
    0%   { background: var(--accent); color: var(--accent-fg); }
    70%  { background: var(--accent); color: var(--accent-fg); }
    100% { background: transparent; }
  }
  .row.flash { animation: flashrow 1.6s ease both; }
  .row.flash .t { color: inherit; }
  .row img { width: 14px; height: 14px; flex: none; border-radius: 2px; }
  .row .glyph { width: 14px; text-align: center; flex: none; color: var(--dim); font-size: 10px; }
  .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row.sleeping .t { color: var(--muted); }
  .row .act {
    opacity: 0; flex: none; border: none; background: none;
    color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 0 3px;
    transition: opacity .12s;
  }
  .row:hover .act { opacity: 1; }
  .row .act:hover { color: var(--fg); }
  .row .act.on { opacity: 1; color: var(--accent); }

  .cmds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 4px var(--pad) 12px; }
  .cmds .tile { padding: 8px 10px; }
  .cmds .tile-main { font-size: 11px; }

  .empty { padding: 3px var(--pad) 7px; font-size: 10px; color: var(--muted); }

  /* облик aside: строки-пилюли со скруглением, подписи секций как в сайдбаре, спящие с zz */
  :root[data-look="aside"] .row { margin: 0 6px; padding: 2px calc(var(--pad) - 6px); border-radius: var(--radius); }
  :root[data-look="aside"] .row.active { box-shadow: var(--sel-shadow); }
  :root[data-look="aside"] .row.drop-into { box-shadow: inset 0 -2px 0 var(--fg); }
  :root[data-look="aside"] .sec-hdr { text-transform: none; letter-spacing: 0; font-size: 11px; }
  :root[data-look="aside"] .sec-hdr .n { color: var(--muted); }
  :root[data-look="aside"] .blk { font-size: 10.5px; letter-spacing: 0; }
  :root[data-look="aside"] .empty { font-size: 10.5px; }
</style>
</head>
<body>
  <header class="aim-shell-head">
    <span class="aim-shell-mark" data-aim-mark="aside"></span>
    <span class="aim-shell-title"><b>aside tweaks</b><small id="count">counting</small></span>
    <span class="aim-shell-gap"></span>
    <span class="aim-shell-version" data-aim-version></span>
    <button class="aim-shell-btn" id="settings" title="settings of the extension">settings</button>
    <button class="aim-shell-btn aim-shell-icon" id="close-panel" title="close the panel · esc">×</button>
  </header>

  <main class="aim-shell-body">
    <div class="sec-hdr"><span class="n">01</span> ★ bookmarks · first row added last <span id="nFav">0</span></div>
    <div id="favs"></div>

    <div class="sec-hdr"><span class="n">02</span> ◆ pinned · squares on top <span id="nPins">0</span></div>
    <div id="pins"></div>

    <div class="sec-hdr"><span class="n">03</span> ▤ tabs · grouped by blocks <span id="nTabs">0</span></div>
    <div id="tabs"></div>

    <div class="sec-hdr"><span class="n">04</span> ⚡ commands · act on this window</div>
    <div class="cmds" id="cmds"></div>
  </main>

  <footer class="aim-shell-foot">
    <span id="status">★ bar · ◆ pin · × close · ⇧⌘K palette</span>
    <span>esc close</span>
    <span data-aim-version></span>
  </footer>

  <script src="theme.js"></script>
  <script src="vendor/aim-app-mark.js"></script>
  <script src="shell.js"></script>
  <script src="commands.js"></script>
  <script src="panel.js"></script>
</body>
</html>
